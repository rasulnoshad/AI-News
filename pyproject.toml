[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "russell-ai-news"
version = "0.1.0"
description = "Local Persian AI news digest"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "feedparser>=6.0,<7",
  "google-genai>=1.0,<2",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "rapidfuzz>=3.9,<4",
  "sqlalchemy>=2.0,<3",
  "trafilatura>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

